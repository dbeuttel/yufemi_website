<!-- Paste inside <head>. Replace every [bracket]. One unique title/description per page. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><!-- never add maximum-scale or user-scalable=no -->
<title>[Primary topic or keyword] | [Brand]</title><!-- ≤ 60 characters -->
<meta name="description" content="[What this page offers and why to click. ≤ 155 characters.]">
<link rel="canonical" href="https://example.com/[path]">

<!-- Social / messaging previews -->
<meta property="og:type" content="website"><!-- "article" for articles, "product" for products -->
<meta property="og:site_name" content="[Brand]">
<meta property="og:title" content="[Title for sharing]">
<meta property="og:description" content="[Description for sharing]">
<meta property="og:url" content="https://example.com/[path]">
<meta property="og:image" content="https://example.com/og-image.png"><!-- 1200×630 -->
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<!-- Icons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Only on pages that must NOT be indexed (thank-you pages, internal search results, staging): -->
<!-- <meta name="robots" content="noindex"> -->
